<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" class="nd act-sleeping" role="img" aria-label="Nellie — Sleeping"><title>Nellie — Sleeping</title><defs><linearGradient id="nd-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient><radialGradient id="nd-gold" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#F7D16C"/><stop offset=".75" stop-color="#D99A2E"/><stop offset="1" stop-color="#98560B"/></radialGradient></defs><style>.nd .nd-eyes{transform-box:view-box;transform-origin:100px 118px}.nd .nd-mouthi{transform-box:view-box;transform-origin:100px 136px}
@keyframes nd-breathe{0%,100%{transform:translate(100px,230px) scale(1,1) translate(-100px,-230px)}50%{transform:translate(100px,230px) scale(1.012,1.022) translate(-100px,-230px)}}
@keyframes nd-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes nd-fadeup{0%{opacity:0;transform:translateY(6px)}30%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
@keyframes nd-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.nd *{animation:none!important}}
@keyframes nd-sleeping-ndall{0%,100%{transform:translate(100px,230px) scale(1,1) translate(-100px,-230px)}50%{transform:translate(100px,230px) scale(1.02,1.035) translate(-100px,-230px)}}.nd.act-sleeping .nd-all{animation:nd-sleeping-ndall 5s cubic-bezier(.45,0,.55,1) infinite}.nd.act-sleeping .nd-p-zzz > path:nth-child(1){animation:nd-fadeup 3s cubic-bezier(.45,0,.55,1) 0s infinite}.nd.act-sleeping .nd-p-zzz > path:nth-child(2){animation:nd-fadeup 3s cubic-bezier(.45,0,.55,1) 0.8s infinite}.nd.act-sleeping .nd-p-zzz > path:nth-child(3){animation:nd-fadeup 3s cubic-bezier(.45,0,.55,1) 1.6s infinite}</style><ellipse cx="100" cy="230" rx="50" ry="7" fill="#000" opacity=".12"/><g class="nd-all"><g class="nd-arms"><g class="nd-arm-l" transform="rotate(0 66 182)"><ellipse cx="60" cy="198" rx="10" ry="18" fill="#A9BACB" transform="rotate(18 60 198)"/><ellipse cx="60" cy="198" rx="10" ry="18" fill="url(#nd-shade)" transform="rotate(18 60 198)"/></g><g class="nd-arm-r" transform="rotate(0 134 182)"><ellipse cx="140" cy="198" rx="10" ry="18" fill="#A9BACB" transform="rotate(-18 140 198)"/><ellipse cx="140" cy="198" rx="10" ry="18" fill="url(#nd-shade)" transform="rotate(-18 140 198)"/></g></g><g class="nd-body"><path d="M58 228 C54 190 70 156 100 154 C130 156 146 190 142 228 C141 234 59 234 58 228 Z" fill="#A9BACB" /><path d="M58 228 C54 190 70 156 100 154 C130 156 146 190 142 228 C141 234 59 234 58 228 Z" fill="url(#nd-shade)" /><circle cx="100" cy="192" r="5" fill="#F2BE4E"/><circle cx="98.2" cy="190.2" r="1.8" fill="#FFF4B8"/></g><g class="nd-head" transform="rotate(12 100 158)"><g class="nd-hbehind"><ellipse cx="50" cy="114" rx="26" ry="32" fill="#93A7BA" /><ellipse cx="50" cy="114" rx="26" ry="32" fill="url(#nd-shade)" /><ellipse cx="150" cy="114" rx="26" ry="32" fill="#93A7BA" /><ellipse cx="150" cy="114" rx="26" ry="32" fill="url(#nd-shade)" /><ellipse cx="52" cy="116" rx="15" ry="20" fill="#E7C1C8" /><ellipse cx="148" cy="116" rx="15" ry="20" fill="#E7C1C8" /></g><g class="nd-hbase"><ellipse cx="100" cy="112" rx="46" ry="44" fill="#A9BACB" /><ellipse cx="100" cy="112" rx="46" ry="44" fill="url(#nd-shade)" /></g><g class="nd-htop"><circle cx="36" cy="128" r="4" fill="#F2BE4E"/><circle cx="34.6" cy="126.6" r="1.4" fill="#FFF4B8"/></g><g class="nd-face"><g class="nd-eyes"><path d="M76 118 Q83 124 90 118" stroke="#2B2F36" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 118 Q117 124 124 118" stroke="#2B2F36" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g class="nd-mouth" transform="translate(19 3)"><g class="nd-mouthi"><path d="M96 135 Q100 138 104 135" stroke="#2B2F36" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></g><ellipse cx="72" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/><ellipse cx="128" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/></g><g class="nd-over"><path d="M100 122 C100 140 98 152 108 160 C114 164 120 160 118 154" stroke="#A9BACB" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M100 122 C100 140 98 152 108 160" stroke="#000" stroke-opacity=".08" stroke-width="13" fill="none" stroke-linecap="round" transform="translate(2 2)"/></g></g><g class="nd-p-zzz"><path d="M140 70 h9 l-9 9.9 h9" stroke="#7C8AA0" stroke-width="2.25" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M154 52 h12 l-12 13.200000000000001 h12" stroke="#7C8AA0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M170 30 h15 l-15 16.5 h15" stroke="#7C8AA0" stroke-width="3.75" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>