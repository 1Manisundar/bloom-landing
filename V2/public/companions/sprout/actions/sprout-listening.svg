<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" class="nd act-listening" role="img" aria-label="Sprout — Listening"><title>Sprout — Listening</title><defs><linearGradient id="nd-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient><radialGradient id="nd-gold" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#F7D16C"/><stop offset=".75" stop-color="#D99A2E"/><stop offset="1" stop-color="#98560B"/></radialGradient></defs><style>.nd .nd-eyes{transform-box:view-box;transform-origin:100px 118px}.nd .nd-mouthi{transform-box:view-box;transform-origin:100px 136px}
@keyframes nd-breathe{0%,100%{transform:translate(100px,230px) scale(1,1) translate(-100px,-230px)}50%{transform:translate(100px,230px) scale(1.012,1.022) translate(-100px,-230px)}}
@keyframes nd-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes nd-fadeup{0%{opacity:0;transform:translateY(6px)}30%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
@keyframes nd-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.nd *{animation:none!important}}
.nd.act-listening .nd-all{animation:nd-breathe 4s cubic-bezier(.45,0,.55,1) infinite}.nd.act-listening .nd-eyes{animation:nd-blink 4.6s linear infinite}@keyframes nd-listening-ndhead{0%,100%{transform:translate(100px,158px) rotate(-8deg) translate(-100px,-158px)}50%{transform:translate(100px,158px) rotate(-4deg) translateY(1.5px) translate(-100px,-158px)}}.nd.act-listening .nd-head{animation:nd-listening-ndhead 2.4s cubic-bezier(.45,0,.55,1) infinite}.nd.act-listening .nd-hb{animation:nd-listening-ndhead 2.4s cubic-bezier(.45,0,.55,1) infinite}@keyframes nd-listening-ndpsound{0%,100%{opacity:.25}50%{opacity:1}}.nd.act-listening .nd-p-sound{animation:nd-listening-ndpsound 1.6s cubic-bezier(.45,0,.55,1) infinite}</style><ellipse cx="100" cy="230" rx="50" ry="7" fill="#000" opacity=".12"/><g class="nd-all"><g class="nd-arms"><g class="nd-arm-l" transform="rotate(0 66 182)"><ellipse cx="60" cy="198" rx="10" ry="18" fill="#8FC27A" transform="rotate(18 60 198)"/><ellipse cx="60" cy="198" rx="10" ry="18" fill="url(#nd-shade)" transform="rotate(18 60 198)"/></g><g class="nd-arm-r" transform="rotate(0 134 182)"><ellipse cx="140" cy="198" rx="10" ry="18" fill="#8FC27A" transform="rotate(-18 140 198)"/><ellipse cx="140" cy="198" rx="10" ry="18" fill="url(#nd-shade)" transform="rotate(-18 140 198)"/></g></g><g class="nd-body"><path d="M66 168 L134 168 L126 226 C125 232 75 232 74 226 Z" fill="#D68A5F" /><path d="M66 168 L134 168 L126 226 C125 232 75 232 74 226 Z" fill="url(#nd-shade)" /><path d="M60 160 L140 160 L140 176 L60 176 Z" fill="#C17650" rx="6"/><path d="M60 160 L140 160 L140 176 L60 176 Z" fill="url(#nd-shade)" rx="6"/></g><g class="nd-head" transform="rotate(-8 100 158)"><g class="nd-hbase"><ellipse cx="100" cy="114" rx="46" ry="44" fill="#A8D58E" /><ellipse cx="100" cy="114" rx="46" ry="44" fill="url(#nd-shade)" /></g><g class="nd-htop"><path d="M100 72 L100 52" stroke="#5E9E4A" stroke-width="5" stroke-linecap="round"/><path d="M100 54 C88 30 62 34 60 44 C72 56 92 58 100 54 Z" fill="#6FB35A" /><path d="M100 54 C88 30 62 34 60 44 C72 56 92 58 100 54 Z" fill="url(#nd-shade)" /><path d="M100 54 C112 26 140 30 142 42 C130 56 108 58 100 54 Z" fill="#6FB35A" /><path d="M100 54 C112 26 140 30 142 42 C130 56 108 58 100 54 Z" fill="url(#nd-shade)" /><circle cx="132" cy="40" r="4.5" fill="#F2BE4E"/><circle cx="130.4" cy="38.4" r="1.6" fill="#FFF4B8"/></g><g class="nd-face"><path d="M76 105 Q83 102 90 105" stroke="#6E9E58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M110 100 Q117 95 124 100" stroke="#6E9E58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><g class="nd-eyes"><ellipse cx="83" cy="119" rx="6" ry="5.4" fill="#2B2F36"/><circle cx="81.2" cy="117.6" r="1.7" fill="#fff"/><path d="M76 116.5 Q83 112.5 90 116.5" stroke="#2B2F36" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="117" cy="119" rx="6" ry="5.4" fill="#2B2F36"/><circle cx="115.2" cy="117.6" r="1.7" fill="#fff"/><path d="M110 116.5 Q117 112.5 124 116.5" stroke="#2B2F36" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g class="nd-mouth" transform="translate(0 0)"><g class="nd-mouthi"><path d="M93 134 Q100 140.5 107 134" stroke="#2B2F36" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></g><ellipse cx="72" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/><ellipse cx="128" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/></g></g><g class="nd-p-sound"><path d="M38 108 Q32 118 38 128" stroke="#D99A2E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/><path d="M30 102 Q21 118 30 134" stroke="#D99A2E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/></g></g></svg>