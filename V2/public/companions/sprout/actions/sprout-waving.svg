/><circle cx="132" cy="40" r="4.5" fill="#F2BE4E"/><circle cx="130.4" cy="38.4" r="1.6" fill="#FFF4B8"/></g><g class="nd-face"><g class="nd-eyes"><path d="M76 121 Q83 112 90 121" stroke="#2B2F36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 121 Q117 112 124 121" stroke="#2B2F36" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g class="nd-mouth" transform="translate(0 0)"><g class="nd-mouthi"><path d="M92 132.5 Q100 145 108 132.5 Z" fill="#6E3A3A"/><path d="M95 138 Q100 142 105 138 Z" fill="#E98C8C"/></g></g><ellipse cx="72" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/><ellipse cx="128" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/></g></g></g></svg>