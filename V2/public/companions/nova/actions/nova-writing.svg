<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" class="nd act-writing" role="img" aria-label="Nova — Writing"><title>Nova — Writing</title><defs><linearGradient id="nd-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient><radialGradient id="nd-gold" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#F7D16C"/><stop offset=".75" stop-color="#D99A2E"/><stop offset="1" stop-color="#98560B"/></radialGradient></defs><style>.nd .nd-eyes{transform-box:view-box;transform-origin:100px 118px}.nd .nd-mouthi{transform-box:view-box;transform-origin:100px 136px}
@keyframes nd-breathe{0%,100%{transform:translate(100px,230px) scale(1,1) translate(-100px,-230px)}50%{transform:translate(100px,230px) scale(1.012,1.022) translate(-100px,-230px)}}
@keyframes nd-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes nd-fadeup{0%{opacity:0;transform:translateY(6px)}30%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
@keyframes nd-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.nd *{animation:none!important}}
.nd.act-writing .nd-all{animation:nd-breathe 4s cubic-bezier(.45,0,.55,1) infinite}@keyframes nd-writing-ndarmr{0%,100%{transform:translate(134px,182px) rotate(38deg) translate(-134px,-182px)}25%{transform:translate(134px,182px) rotate(42deg) translate(-134px,-182px)}50%{transform:translate(134px,182px) rotate(36deg) translate(-134px,-182px)}75%{transform:translate(134px,182px) rotate(43deg) translate(-134px,-182px)}}.nd.act-writing .nd-arm-r{animation:nd-writing-ndarmr 1.1s cubic-bezier(.45,0,.55,1) infinite}.nd.act-writing .nd-scribble{stroke-dasharray:40;animation:nd-writing-scr 2.2s linear infinite}@keyframes nd-writing-scr{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}</style><ellipse cx="100" cy="230" rx="50" ry="7" fill="#000" opacity=".12"/><g class="nd-all"><g class="nd-tail"><path d="M30.0 53.0 L31.8 58.2 L37.0 60.0 L31.8 61.8 L30.0 67.0 L28.2 61.8 L23.0 60.0 L28.2 58.2 Z" fill="#FFF4B8"/><path d="M172.0 63.0 L173.8 68.2 L179.0 70.0 L173.8 71.8 L172.0 77.0 L170.2 71.8 L165.0 70.0 L170.2 68.2 Z" fill="#FFF4B8"/><path d="M170.0 193.0 L171.8 198.2 L177.0 200.0 L171.8 201.8 L170.0 207.0 L168.2 201.8 L163.0 200.0 L168.2 198.2 Z" fill="#FFF4B8"/></g><g class="nd-head" transform="rotate(6 100 158)"><g class="nd-hbase"><path d="M100.0 44.0 L130.6 97.9 L191.3 110.3 L149.5 156.1 L156.4 217.7 L100.0 192.0 L43.6 217.7 L50.5 156.1 L8.7 110.3 L69.4 97.9 Z" fill="#FFD86B" stroke="#FFD86B" stroke-width="18" stroke-linejoin="round"/><path d="M100.0 44.0 L130.6 97.9 L191.3 110.3 L149.5 156.1 L156.4 217.7 L100.0 192.0 L43.6 217.7 L50.5 156.1 L8.7 110.3 L69.4 97.9 Z" fill="url(#nd-shade)" stroke="url(#nd-shade)" stroke-width="18" stroke-linejoin="round"/></g><g class="nd-face"><g class="nd-eyes"><ellipse cx="83" cy="121" rx="6" ry="5" fill="#2B2F36"/><circle cx="81.2" cy="120" r="1.6" fill="#fff"/><path d="M76 118.5 Q83 116 90 118.5" stroke="#2B2F36" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="117" cy="121" rx="6" ry="5" fill="#2B2F36"/><circle cx="115.2" cy="120" r="1.6" fill="#fff"/><path d="M110 118.5 Q117 116 124 118.5" stroke="#2B2F36" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g class="nd-mouth" transform="translate(0 0)"><g class="nd-mouthi"><path d="M96 135 Q100 138 104 135" stroke="#2B2F36" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></g><ellipse cx="72" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/><ellipse cx="128" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/></g></g><g class="nd-arms"></g></g></svg>