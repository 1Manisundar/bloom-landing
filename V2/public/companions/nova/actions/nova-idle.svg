<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" class="nd act-idle" role="img" aria-label="Nova — Idle"><title>Nova — Idle</title><defs><linearGradient id="nd-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient><radialGradient id="nd-gold" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#F7D16C"/><stop offset=".75" stop-color="#D99A2E"/><stop offset="1" stop-color="#98560B"/></radialGradient></defs><style>.nd .nd-eyes{transform-box:view-box;transform-origin:100px 118px}.nd .nd-mouthi{transform-box:view-box;transform-origin:100px 136px}
@keyframes nd-breathe{0%,100%{transform:translate(100px,230px) scale(1,1) translate(-100px,-230px)}50%{transform:translate(100px,230px) scale(1.012,1.022) translate(-100px,-230px)}}
@keyframes nd-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes nd-fadeup{0%{opacity:0;transform:translateY(6px)}30%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
@keyframes nd-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.nd *{animation:none!important}}
