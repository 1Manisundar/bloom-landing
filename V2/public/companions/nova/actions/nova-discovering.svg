<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" class="nd act-discovering" role="img" aria-label="Nova — Discovering a pattern"><title>Nova — Discovering a pattern</title><defs><linearGradient id="nd-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient><radialGradient id="nd-gold" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#FFF4B8"/><stop offset=".35" stop-color="#F7D16C"/><stop offset=".75" stop-color="#D99A2E"/><stop offset="1" stop-color="#98560B"/></radialGradient></defs><style>.nd .nd-eyes{transform-box:view-box;transform-origin:100px 118px}.nd .nd-mouthi{transform-box:view-box;transform-origin:100px 136px}
@keyframes nd-breathe{0%,100%{transform:translate(100px,230px) scale(1,1) translate(-100px,-230px)}50%{transform:translate(100px,230px) scale(1.012,1.022) translate(-100px,-230px)}}
@keyframes nd-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes nd-fadeup{0%{opacity:0;transform:translateY(6px)}30%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
@keyframes nd-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.nd *{animation:none!important}}
.nd.act-discovering .nd-eyes{animation:nd-blink 4.6s linear infinite}.nd.act-discovering .nd-thread{stroke-dasharray:120;animation:nd-discovering-th 3.2s cubic-bezier(.22,1,.36,1) infinite}@keyframes nd-discovering-th{0%,10%{stroke-dashoffset:120}55%,100%{stroke-dashoffset:0}}.nd.act-discovering .nd-orb,.nd.act-discovering .nd-orb-glow{transform-box:fill-box;transform-origin:center;animation:nd-discovering-orb 3.2s cubic-bezier(.22,1,.36,1) infinite}@keyframes nd-discovering-orb{0%,35%{opacity:0;transform:translateY(14px) scale(.4)}60%{opacity:1;transform:translateY(0) scale(1.1)}75%,100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes nd-discovering-ndall{0%,40%{transform:translate(100px,230px) translateY(0) translate(-100px,-230px)}55%{transform:translate(100px,230px) translateY(-6px) translate(-100px,-230px)}70%,100%{transform:translate(100px,230px) translateY(0) translate(-100px,-230px)}}.nd.act-discovering .nd-all{animation:nd-discovering-ndall 3.2s cubic-bezier(.22,1,.36,1) infinite}</style><ellipse cx="100" cy="230" rx="50" ry="7" fill="#000" opacity=".12"/><g class="nd-all"><g class="nd-tail"><path d="M30.0 53.0 L31.8 58.2 L37.0 60.0 L31.8 61.8 L30.0 67.0 L28.2 61.8 L23.0 60.0 L28.2 58.2 Z" fill="#FFF4B8"/><path d="M172.0 63.0 L173.8 68.2 L179.0 70.0 L173.8 71.8 L172.0 77.0 L170.2 71.8 L165.0 70.0 L170.2 68.2 Z" fill="#FFF4B8"/><path d="M170.0 193.0 L171.8 198.2 L177.0 200.0 L171.8 201.8 L170.0 207.0 L168.2 201.8 L163.0 200.0 L168.2 198.2 Z" fill="#FFF4B8"/></g><g class="nd-arms"></g><g class="nd-head" transform="rotate(-3 100 158)"><g class="nd-hbase"><path d="M100.0 44.0 L130.6 97.9 L191.3 110.3 L149.5 156.1 L156.4 217.7 L100.0 192.0 L43.6 217.7 L50.5 156.1 L8.7 110.3 L69.4 97.9 Z" fill="#FFD86B" stroke="#FFD86B" stroke-width="18" stroke-linejoin="round"/><path d="M100.0 44.0 L130.6 97.9 L191.3 110.3 L149.5 156.1 L156.4 217.7 L100.0 192.0 L43.6 217.7 L50.5 156.1 L8.7 110.3 L69.4 97.9 Z" fill="url(#nd-shade)" stroke="url(#nd-shade)" stroke-width="18" stroke-linejoin="round"/></g><g class="nd-face"><path d="M76 101 Q83 97 90 101" stroke="#C99A2E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M110 101 Q117 97 124 101" stroke="#C99A2E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><g class="nd-eyes"><ellipse cx="83" cy="117" rx="7.2" ry="9" fill="#2B2F36"/><circle cx="80.6" cy="113.5" r="2.6" fill="#fff"/><circle cx="85.4" cy="121" r="1.2" fill="#fff" opacity=".6"/><ellipse cx="117" cy="117" rx="7.2" ry="9" fill="#2B2F36"/><circle cx="114.6" cy="113.5" r="2.6" fill="#fff"/><circle cx="119.4" cy="121" r="1.2" fill="#fff" opacity=".6"/></g><g class="nd-mouth" transform="translate(0 0)"><g class="nd-mouthi"><ellipse cx="100" cy="136" rx="4.2" ry="5.2" fill="#6E3A3A"/></g></g><ellipse cx="72" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/><ellipse cx="128" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/></g></g><g class="nd-p-aha"><path class="nd-thread" d="M64 64 C80 40 92 72 100 52 C108 32 122 62 136 40" stroke="#D99A2E" stroke-width="3" fill="none" stroke-linecap="round"/><circle class="nd-orb-glow" cx="100" cy="26" r="22" fill="#F7D16C" opacity=".28"/><circle class="nd-orb" cx="100" cy="26" r="12" fill="url(#nd-gold)"/></g></g></svg>