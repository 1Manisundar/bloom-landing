roke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M110 100 Q117 95 124 100" stroke="#B79E84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><g class="nd-eyes"><ellipse cx="85" cy="115.5" rx="6.2" ry="7.6" fill="#2B2F36"/><circle cx="85.5" cy="111.8" r="2.1" fill="#fff"/><ellipse cx="119" cy="115.5" rx="6.2" ry="7.6" fill="#2B2F36"/><circle cx="119.5" cy="111.8" r="2.1" fill="#fff"/></g><g class="nd-mouth" transform="translate(0 0)"><g class="nd-mouthi"><path d="M95 136 L105 136" stroke="#2B2F36" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></g><ellipse cx="72" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/><ellipse cx="128" cy="131" rx="7" ry="4.5" fill="#FF8F8F" opacity="0.3"/></g></g><g class="nd-arms"><g class="nd-arm-l" transform="rotate(0 66 182)"><ellipse cx="60" cy="198" rx="10" ry="18" fill="#E6D6C2" transform="rotate(18 60 198)"/><ellipse cx="60" cy="198" rx="10" ry="18" fill="url(#nd-shade)" transform="rotate(18 60 198)"/></g><g class="nd-arm-r" transform="rotate(160 134 182)"><ellipse cx="140" cy="198" rx="10" ry="18" fill="#E6D6C2" transform="rotate(-18 140 198)"/><ellipse cx="140" cy="198" rx="10" ry="18" fill="url(#nd-shade)" transform="rotate(-18 140 198)"/></g></g><g class="nd-p-thought"><circle class="nd-d1" cx="146" cy="80" r="4" fill="#C9D2DC"/><circle class="nd-d2" cx="156" cy="64" r="6" fill="#C9D2DC"/><circle class="nd-d3" cx="170" cy="44" r="9" fill="#C9D2DC"/></g></g></svg>